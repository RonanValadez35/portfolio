name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Configure Hostinger SSH access
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
          HOSTINGER_DEPLOY_PATH: ${{ vars.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          for name in \
            HOSTINGER_HOST \
            HOSTINGER_USERNAME \
            HOSTINGER_SSH_PRIVATE_KEY \
            HOSTINGER_SSH_KNOWN_HOSTS \
            HOSTINGER_DEPLOY_PATH
          do
            if [ -z "${!name:-}" ]; then
              echo "Required GitHub Actions setting is missing: ${name}" >&2
              exit 1
            fi
          done

          printf '%s\n' "$HOSTINGER_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/hostinger_deploy_key"
          printf '%s\n' "$HOSTINGER_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/hostinger_known_hosts"
          chmod 600 "$RUNNER_TEMP/hostinger_deploy_key" "$RUNNER_TEMP/hostinger_known_hosts"

      - name: Deploy dist to Hostinger
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_DEPLOY_PATH: ${{ vars.HOSTINGER_DEPLOY_PATH }}
          HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
        run: |
          set -euo pipefail

          SSH_COMMAND="ssh -p ${HOSTINGER_PORT} -i ${RUNNER_TEMP}/hostinger_deploy_key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${RUNNER_TEMP}/hostinger_known_hosts"

          rsync \
            --archive \
            --compress \
            --delay-updates \
            --partial \
            --itemize-changes \
            -e "$SSH_COMMAND" \
            dist/ \
            "${HOSTINGER_USERNAME}@${HOSTINGER_HOST}:${HOSTINGER_DEPLOY_PATH%/}/"
